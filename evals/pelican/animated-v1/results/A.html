<script>
(() => {
  'use strict';
  // Shared phase: every animated quantity is periodic at exactly 6000 ms.
  // All units are SVG viewBox units; change these values to edit the mechanism.
  const CONFIG = Object.freeze({ duration: 6000, crank: { x: 578, y: 630, radius: 48 },
    hip: { near: {x: 545, y: 477}, far: {x: 530, y: 474} },
    upperLeg: 102, lowerLeg: 113, wheelRadius: 124, gearRatio: 2, phaseOffset: -.55 });
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const f = n => Number(n.toFixed(4));
  const attr = (el, name, value) => el.setAttribute(name, value);
  const P = p => `${f(p.x)} ${f(p.y)}`;
  // Generate crossed spokes as SVG lines, keeping the document vector-editable.
  for (let i = 0; i < 20; i++) {
    const a = i * TAU / 20, b = a + (i % 2 ? .22 : -.22);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    for (const [key, value] of Object.entries({x1: 10 * Math.cos(b), y1: 10 * Math.sin(b), x2: 103 * Math.cos(a), y2: 103 * Math.sin(a)})) attr(line, key, f(value));
    $('spoke-template').appendChild(line);
  }
  // Two-link inverse kinematics, fixed lengths, always the forward knee branch.
  function solveLeg(hip, ankle) {
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    const d = Math.hypot(dx, dy), a = CONFIG.upperLeg, b = CONFIG.lowerLeg;
    const along = (a*a - b*b + d*d) / (2*d);
    const height = Math.sqrt(Math.max(0, a*a - along*along));
    return { x: hip.x + along*dx/d + height*dy/d,
      y: hip.y + along*dy/d - height*dx/d };
  }
  function legPose(side, angle) {
    const c = CONFIG.crank, hip = CONFIG.hip[side];
    const pedal = { x: c.x + c.radius*Math.cos(angle), y: c.y + c.radius*Math.sin(angle) };
    // Horizontal feet and freely pivoting level pedals: the sole is at pedal y−4.
    const ankle = { x: pedal.x-10, y: pedal.y-20 }, knee = solveLeg(hip, ankle);
    const d = `M${P(hip)}L${P(knee)}L${P(ankle)}`;
    attr($(side+'-leg-outline'), 'd', d); attr($(side+'-leg-color'), 'd', d);
    attr($(side+'-knee'), 'cx', f(knee.x)); attr($(side+'-knee'), 'cy', f(knee.y));
    attr($(side+'-pedal'), 'transform', `translate(${P(pedal)})`);
    attr($(side+'-foot'), 'transform', `translate(${P(pedal)})`);
    attr($(side+'-crank'), 'd', `M${c.x} ${c.y}L${P(pedal)}`);
    if (side === 'near') {
      attr($('near-crank-shine'), 'd', `M${c.x} ${c.y}L${P(pedal)}`);
      attr($('near-shin-highlight'), 'd', `M${f(knee.x+2)} ${f(knee.y+8)}L${f(ankle.x+2)} ${f(ankle.y-9)}`);
    }
    return { hip, knee, ankle, pedal };
  }
  function render(milliseconds) {
    const phase = ((milliseconds % CONFIG.duration) + CONFIG.duration) % CONFIG.duration / CONFIG.duration;
    const angle = phase*TAU + CONFIG.phaseOffset;
    const near = legPose('near', angle), far = legPose('far', angle+Math.PI);
    const wheelDegrees = f(phase*360*CONFIG.gearRatio);
    for (const id of ['rear-spin', 'front-spin']) attr($(id), 'transform', `rotate(${wheelDegrees})`);
    attr($('chainring-spin'), 'transform', `rotate(${f(angle*180/Math.PI)})`);
    attr($('chain-links'), 'stroke-dashoffset', f(-phase*TAU*30));
    // Rolling without slipping: road translates by the wheels' travelled arc.
    const roadTravel = phase*TAU*CONFIG.wheelRadius*CONFIG.gearRatio;
    attr($('road-pattern'), 'patternTransform', `translate(${f(-roadTravel)} 0)`);
    // Air and water move gently. Their sine functions share the same loop seam.
    attr($('sea-lines'), 'transform', `translate(${f(5*Math.sin(phase*TAU))} 0)`);
    attr($('sailboat'), 'transform', `translate(1050 ${f(487+1.6*Math.sin(phase*TAU))})`);
    attr($('breeze'), 'opacity', f(.55+.18*Math.sin(phase*TAU)));
    const flutter = Math.sin(phase*TAU*2), flutter2 = Math.sin(phase*TAU*2+.7);
    attr($('scarf-tail-back'), 'd', `M632 353Q606 ${f(332+flutter2*4)} 568 ${f(348+flutter2*6)}L580 ${f(360+flutter2*5)} 562 ${f(368+flutter2*6)}Q599 ${f(374+flutter2*3)} 635 365Z`);
    attr($('scarf-tail-front'), 'd', `M634 354Q608 ${f(350+flutter*3)} 591 ${f(368+flutter*5)}T545 ${f(374+flutter*7)}L556 ${f(391+flutter*7)}Q606 ${f(394+flutter*4)} 639 366Z`);
