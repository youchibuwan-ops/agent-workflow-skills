# This bundle requires the controlled launcher. Ordinary DSH startup has no
# bound controller and fails before any model runner can be admitted.
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- id: hmr
  disabled: true
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: config-editor
  disabled: true
- id: settings
  disabled: true
- id: session-title-llm
  disabled: true
- id: spill-policy
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: agent-loop
  config:
    agents: []
- id: tools
  config:
    mode: native
- insert:
    - id: proactive-workflow-guard
      name: dsh-proactive-workflow
