name: DSH Windows distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.1'
      - run: npm.cmd ci --ignore-scripts
      - run: npm.cmd run lint
      - name: Windows PowerShell 5.1 lifecycle
        shell: powershell
        run: ./tests/dsh-lifecycle.ps1 -ReportPath docs/dsh/evidence/windows-lifecycle.json
      - run: npm.cmd ci --prefix tests/dsh-runtime --ignore-scripts
      - run: node scripts/verify-dsh-runtime.mjs tests/dsh-runtime docs/dsh/evidence/official-components.json
      - name: Build preview archive
        shell: powershell
        run: ./scripts/build-dsh-package.ps1 -OutputDirectory dist/ci
      - name: Extract and exercise ZIP
        shell: powershell
        run: ./tests/dsh-zip.ps1 -ZipPath dist/ci/agent-workflow-skills-dsh-preview.zip -ReportPath docs/dsh/evidence/zip-test.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-windows-preview
          path: |
            dist/ci/*.zip
            dist/ci/*.sha256
            docs/dsh/evidence/*.json
