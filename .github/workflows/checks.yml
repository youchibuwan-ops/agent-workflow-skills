name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run test:dsh
      - run: npm run test:workflow
      - run: python -m unittest discover -s evals/codex -p test_run.py
      - run: python -m unittest discover -s evals/discovery-gates -p test_run.py
      - run: python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - run: skills-ref validate skills/proactive-skill-discovery
      - run: skills-ref validate skills/proactive-skill-discovery-dsh
      - run: npm run verify:install
      - run: npm run assemble:example
      - run: npm run render:example
      - run: git diff --exit-code -- examples/svg-binder-clip examples/controlled-bracket
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --config .lychee.toml --no-progress --max-concurrency 4 --timeout 30 --max-retries 2 './**/*.md'
          fail: true
  global-hosts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      PYTHONUTF8: '1'
      DSH_RUNTIME_ROOT: ${{ github.workspace }}/hosts/dsh
      WORKFLOW_REAL_SANDBOX_TEST: '0'
      SOURCE_PROVIDER_REAL_NETWORK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Canonical Windows temporary directories for native fixtures
        if: runner.os == 'Windows'
        run: >-
          node --input-type=module -e "import {appendFileSync,realpathSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          const canonical=realpathSync.native(tmpdir());
          appendFileSync(process.env.GITHUB_ENV,'TEMP='+canonical+'\nTMP='+canonical+'\n');"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix hosts/codex --ignore-scripts
      - run: npm ci --prefix hosts/dsh --ignore-scripts --omit=dev
      - run: npm audit --prefix hosts/codex --audit-level=low
      - run: npm audit --prefix hosts/dsh --audit-level=low
      - name: Require the installed DSH runtime before scripted native tests
        run: >-
          node --input-type=module -e "import {resolveDshRuntime} from './hosts/dsh-global/runtime.mjs';
          import {readFileSync,existsSync} from 'node:fs';
          if(!process.env.DSH_RUNTIME_ROOT) throw Error('DSH runtime is required in CI');
          const runtime=resolveDshRuntime(process.env.DSH_RUNTIME_ROOT);
          if(JSON.parse(readFileSync(runtime.installAnchor)).version!=='0.2.1-rc.2'||!existsSync(runtime.bin)) throw Error('Wrong DSH runtime');
          console.log('Installed DSH 0.2.1-rc.2 ready for local scripted-provider tests');"
      - run: npm run test:hosts
      - run: npm run test:host-native
      - name: Windows full global host tests, including actual scripted DSH profiles
        if: runner.os == 'Windows'
        run: npm run test:global
      - name: Windows companion missing-capability refusal checks
        if: runner.os == 'Windows'
        run: node --test evals/global-entry/*.test.mjs
      - name: Linux portable global tests and explicit unsupported-native refusal checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node -e "console.log('Linux scope: portable global tests plus missing-pwsh fail-closed checks. broker.test.mjs and launcher-native.test.mjs require verified Windows native IO and run in full on Windows. The cross-platform test:hosts and test:host-native steps above remain required.');"
          mapfile -t dsh_unit_tests < <(node --input-type=module -e "import {readdirSync} from 'node:fs'; for(const name of readdirSync('hosts/dsh-global').sort()) if(name.endsWith('.test.mjs')&&!['broker.test.mjs','launcher-native.test.mjs'].includes(name)) console.log('hosts/dsh-global/'+name);")
          node --test hosts/core/*.test.mjs hosts/providers/*.test.mjs hosts/security/*.test.mjs hosts/conversation/*.test.mjs hosts/codex-global/*.test.mjs "${dsh_unit_tests[@]}" hosts/codex-global/probes/*.test.mjs hosts/dsh-global/probes/*.test.mjs evals/global-entry/*.test.mjs
  global-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Canonical Windows temporary directories for package fixtures
        if: runner.os == 'Windows'
        run: >-
          node --input-type=module -e "import {appendFileSync,realpathSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          const canonical=realpathSync.native(tmpdir());
          appendFileSync(process.env.GITHUB_ENV,'TEMP='+canonical+'\nTMP='+canonical+'\n');"
      - name: Preserve the historical builder and original evidence bytes
        run: node scripts/check-frozen-preview.mjs
      - run: npm run test:global-package
      - name: Build the current global source package with its own manifest
        run: npm run build:global -- "${{ runner.temp }}/AgentWorkflow-global-preview2.zip"
      - name: Export the new manifest from the verified ZIP
        run: >-
          node --input-type=module -e "import {readGlobalZip} from './scripts/build-global-package.mjs';
          import {readFileSync,writeFileSync} from 'node:fs'; import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const entries=readGlobalZip(readFileSync(join(process.env.RUNNER_TEMP,'AgentWorkflow-global-preview2.zip')));
          const manifest=entries.find(e=>e.path.endsWith('/manifest.json'));
          if(!manifest) throw Error('Current global manifest missing');
          const data=JSON.parse(manifest.bytes);
          if(!data.files.some(e=>e.path==='hosts/codex-global/launch.mjs')||data.files.some(e=>e.path.startsWith('evidence/host-preview-20261025/'))) throw Error('Wrong release scope');
          writeFileSync(join(process.env.RUNNER_TEMP,'global-manifest.json'),manifest.bytes,{flag:'wx'});
          console.log('Current global source manifest SHA256',createHash('sha256').update(manifest.bytes).digest('hex'));"
  legacy-preview:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: legacy-preview
    env:
      PYTHONUTF8: '1'
      WORKFLOW_PREVIEW_REAL_INSTALL: '0'
    steps:
      - name: Checkout only the historical preview.1 release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 004e3407ef40de377d650336805999953f3cfdaf
          path: legacy-preview
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Regress the frozen preview artifact and its original 17 source pins
        run: node --test scripts/host-preview.test.mjs
