name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: python -m unittest discover -s evals/codex -p test_run.py
      - run: python -m unittest discover -s evals/codex -p test_svg_workflow.py
      - run: python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - run: skills-ref validate skills/proactive-skill-discovery
      - run: skills-ref validate skills/crafting-reference-based-svg-assets
      - run: npm run verify:install
      - run: npm run assemble:example
      - run: npm run render:example
      - run: git diff --exit-code -- examples/svg-binder-clip examples/controlled-bracket
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: --config .lychee.toml --no-progress --max-concurrency 4 --timeout 30 --max-retries 2 './**/*.md'
          fail: true
